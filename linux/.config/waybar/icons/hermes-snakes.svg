<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow-front" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-back" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#050508"/>

  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- ─── SNAKE 2 (right side, behind at top crossing) ─── -->
    <g filter="url(#glow-back)">
      <!-- Full body: head → first crossing → second crossing → tail -->
      <path d="M 292 200
               C 280 188, 252 190, 248 208
               C 244 226, 272 230, 274 244
               C 276 258, 250 258, 244 250"
            fill="none" stroke="#00cc35" stroke-width="6" stroke-opacity="0.5"/>
      <!-- Body tail extension (behind at bottom) -->
      <path d="M 244 250 C 240 242, 248 232, 256 235"
            fill="none" stroke="#00cc35" stroke-width="5" stroke-opacity="0.5"/>
      <!-- Head - diamond shape -->
      <path d="M 297 200 L 292 194 L 285 199 L 290 206 Z"
            fill="#00cc35" fill-opacity="0.5"/>
      <!-- Eye -->
      <circle cx="291" cy="197" r="1.2" fill="#050508"/>
    </g>

    <!-- ─── SNAKE 1 (left side, front at top crossing) ─── -->
    <g filter="url(#glow-front)">
      <!-- Full body: head → first crossing → second crossing → tail -->
      <path d="M 220 200
               C 232 188, 260 190, 264 208
               C 268 226, 240 230, 238 244
               C 236 258, 262 258, 268 250"
            fill="none" stroke="#00ff41" stroke-width="6" stroke-opacity="0.9"/>
      <!-- Body tail extension (behind at bottom) -->
      <path d="M 268 250 C 272 242, 264 232, 256 235"
            fill="none" stroke="#00ff41" stroke-width="5" stroke-opacity="0.7"/>
      <!-- Head - diamond shape -->
      <path d="M 215 200 L 220 194 L 227 199 L 222 206 Z"
            fill="#00ff41" fill-opacity="0.9"/>
      <!-- Eye -->
      <circle cx="221" cy="197" r="1.2" fill="#050508"/>
      <!-- Tongue -->
      <path d="M 227 199 C 234 195, 238 192, 242 193 M 234 196 L 240 199"
            fill="none" stroke="#00ff41" stroke-width="1.2" stroke-opacity="0.8"/>
    </g>

    <!-- ─── SNAKE 2 tail tip (on top at bottom crossing) ─── -->
    <g filter="url(#glow-back)">
      <path d="M 256 235 C 260 240, 258 248, 252 248"
            fill="none" stroke="#00cc35" stroke-width="4" stroke-opacity="0.5"/>
    </g>

    <!-- ─── SNAKE 1 tail tip ─── -->
    <g filter="url(#glow-front)">
      <path d="M 256 235 C 252 240, 254 248, 260 248"
            fill="none" stroke="#00ff41" stroke-width="4" stroke-opacity="0.6"/>
    </g>

    <!-- ─── DIAMOND SCALES ─── -->
    <g fill="none" stroke-width="0.5" stroke-opacity="0.2">
      <!-- Snake 1 scales -->
      <path d="M 232 204 l 3 2.5 l -3 2.5 l -3 -2.5 Z" stroke="#00ff41"/>
      <path d="M 246 208 l 3 2.5 l -3 2.5 l -3 -2.5 Z" stroke="#00ff41"/>
      <path d="M 260 212 l 3 2.5 l -3 2.5 l -3 -2.5 Z" stroke="#00ff41"/>
      <path d="M 262 224 l 3 2.5 l -3 2.5 l -3 -2.5 Z" stroke="#00ff41"/>
      <path d="M 256 234 l 3 2.5 l -3 2.5 l -3 -2.5 Z" stroke="#00ff41"/>
      <path d="M 248 242 l 3 2.5 l -3 2.5 l -3 -2.5 Z" stroke="#00ff41"/>
      <!-- Snake 2 scales -->
      <path d="M 280 204 l 3 2.5 l -3 2.5 l -3 -2.5 Z" stroke="#00cc35"/>
      <path d="M 266 208 l 3 2.5 l -3 2.5 l -3 -2.5 Z" stroke="#00cc35"/>
      <path d="M 252 212 l 3 2.5 l -3 2.5 l -3 -2.5 Z" stroke="#00cc35"/>
      <path d="M 250 224 l 3 2.5 l -3 2.5 l -3 -2.5 Z" stroke="#00cc35"/>
      <path d="M 256 234 l 3 2.5 l -3 2.5 l -3 -2.5 Z" stroke="#00cc35"/>
      <path d="M 264 242 l 3 2.5 l -3 2.5 l -3 -2.5 Z" stroke="#00cc35"/>
    </g>

  </g>

  <radialGradient id="v" cx="50%" cy="50%" r="55%">
    <stop offset="50%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
  </radialGradient>
  <rect width="512" height="512" fill="url(#v)"/>
</svg>
